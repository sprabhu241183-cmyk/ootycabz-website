name: Update review count

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-review-count.yml'

permissions:
  contents: write

jobs:
  update-review-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Google review count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<p class="sub">Real 5-star Google reviews from travellers who chose Ooty Cabz Taxi Service.</p>'
          new = old + '<p class="sub"><strong>⭐ 5.0★ rating • 56 Google reviews</strong></p>'
          if '56 Google reviews' not in s:
              if old not in s:
                  raise SystemExit('Review section text not found; stopping without changes.')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Update Google review count' || exit 0
          git push
